# ======================================================
# CONFIGURACIÓN GENERAL
# ======================================================
spring.application.name=playstop-backend

# ======================================================
# BASE DE DATOS (NEON TECH)
# ======================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de HikariCP (Optimizado para el plan gratuito de Render)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-test-query=SELECT 1

# ======================================================
# JPA / HIBERNATE
# ======================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ======================================================
# SEGURIDAD Y JWT
# ======================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ======================================================
# CORREO ELECTRÓNICO
# ======================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
app.mail.from=${MAIL_FROM:principemerinosheila@gmail.com}

# ======================================================
# SERVIDOR Y PUERTO
# ======================================================
server.port=${PORT:8080}

# ======================================================
# GESTIÓN DE ARCHIVOS Y RUTAS
# ======================================================
app.upload.dir=${UPLOAD_DIR:/tmp/uploads}
app.base-url=${APP_BASE_URL}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
